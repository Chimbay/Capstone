name: CI

on:
  push:
    # renovate/** too: Renovate auto-merges minor updates once checks pass, and with no checks it would merge untested
    branches: [main, 'renovate/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend (Rust)
    # The app ships on Windows, and some path-safety tests only run there.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri's build script requires the frontend output folder to exist; these checks don't need its contents.
      - name: Placeholder frontend build
        run: mkdir -p ../dist

      - name: Formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install
        run: bun install --frozen-lockfile

      - name: Types
        run: bun run typecheck

      - name: Lint
        run: bun run eslint

      - name: Formatting
        run: bun run prettier

      - name: Tests
        run: bun test
